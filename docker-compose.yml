services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_jobs_schema.sql:/docker-entrypoint-initdb.d/001_jobs_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=jobtracker;Username=jobtracker;Password=jobtracker
      Frontend__Origin: http://localhost:3000
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5020:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://backend:8080
    environment:
      API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5020
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
